<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="tcGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="tcGradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0B132B"/>

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.12" stroke="#00E5FF" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Outer Interconnected Orbit / Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#tcGrad1)" stroke-width="6" stroke-dasharray="16 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.25"/>

  <!-- Glowing Nodes -->
  <circle cx="112" cy="256" r="14" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="400" cy="256" r="14" fill="#FF6B00" filter="url(#glow)"/>
  <circle cx="256" cy="112" r="12" fill="#00E5FF" opacity="0.9"/>
  <circle cx="256" cy="400" r="12" fill="#FF6B00" opacity="0.9"/>

  <!-- Connection Beams -->
  <line x1="112" y1="256" x2="190" y2="256" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="322" y1="256" x2="400" y2="256" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="112" x2="256" y2="185" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="327" x2="256" y2="400" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central TecConecta Monogram Badge -->
  <rect x="180" y="180" width="152" height="152" rx="36" fill="#111B3D" stroke="url(#tcGrad1)" stroke-width="4"/>
  
  <!-- Stylized "T" and "C" Connected Paths -->
  <!-- "T" Bar & Stem in Cyan -->
  <path d="M 210 216 L 260 216 M 235 216 L 235 296" stroke="url(#tcGradCyan)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "C" Arc in Orange -->
  <path d="M 302 232 C 290 216, 266 216, 256 226 C 242 240, 242 272, 256 286 C 266 296, 290 296, 302 280" fill="none" stroke="url(#tcGradOrange)" stroke-width="9" stroke-linecap="round"/>

  <!-- Geolocation Location Pin Accent at the top center -->
  <g transform="translate(256, 76) scale(0.85)">
    <path d="M 0 -18 C -10 -18 -18 -10 -18 0 C -18 12 0 28 0 28 C 0 28 18 12 18 0 C 18 -10 10 -18 0 -18 Z" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#0B132B"/>
  </g>
</svg>
