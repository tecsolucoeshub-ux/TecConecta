    <meta property="og:description" content="Plataforma geolocalizada de conexão direta entre prestadores de serviços, profissionais autônomos, MEIs e clientes via WhatsApp, desenvolvida pela TecSoluções." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="bg-[#0B132B] text-[#F4F7F6] antialiased selection:bg-[#00E5FF]/30 selection:text-[#00E5FF]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B132B; color: #F4F7F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px; text-align: center;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(0, 229, 255, 0.2); border-top-color: #00E5FF; animation: tecSpin 1s linear infinite;"></div>
          <div style="width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #00E5FF, #FF6B00); box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);"></div>
        </div>
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; margin: 0 0 6px 0; color: #FFFFFF; letter-spacing: -0.02em;">
          Tec<span style="color: #00E5FF;">Conecta</span>
        </h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; max-width: 300px;">
          Carregando plataforma da TecSoluções...
        </p>
        <style>
          @keyframes tecSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
